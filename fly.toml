app = "nomagoride"
primary_region = "fra"

[build]

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 80
    hard_limit = 100

# Smallest paid VM: shared-cpu-1x @ 256MB.
# Combined with min_machines_running = 0 and auto_stop_machines = "stop"
# the app idles at zero machines and only spins up on traffic. With low
# usage this fits comfortably inside the monthly hobby credit.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
